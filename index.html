<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expedientes - Bufete Popular</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bufete Popular</h1>
    <p>Gestión de Expedientes</p>
  </header>

  <main>
    <!-- Aquí va a ir el formulario de crear expediente -->
    <section id="crear-expediente">
  <h2>Abrir nuevo expediente</h2>

  <form id="form-expediente">
    <div>
      <label>Nombre o alias de la persona *</label>
      <input type="text" id="nombre" required>
    </div>

    <div>
      <label>Descripción del asunto *</label>
      <textarea id="descripcion" rows="3" required></textarea>
    </div>

    <div>
      <label>Nombre del responsable *</label>
      <input type="text" id="responsable" required>
    </div>

    <div>
      <label>Categoría (opcional)</label>
      <select id="categoria">
        <option value="">-- Sin categoría --</option>
        <option value="Civil">Civil</option>
        <option value="Familiar">Familiar</option>
        <option value="Laboral">Laboral</option>
      </select>
    </div>

    <button type="submit">Abrir expediente</button>
  </form>

  <p id="mensaje" style="margin-top: 15px; font-weight: bold;"></p>
</section>

    <!-- Aquí va el listado -->
    <section id="listado">
  <h2>Expedientes</h2>

  <div style="margin-bottom: 15px;">
    <input type="text" id="buscar" placeholder="Buscar por ID o nombre..." style="padding: 8px; width: 250px;">
    <button onclick="buscarExpedientes()">Buscar</button>
    <button onclick="mostrarTodos()">Mostrar todos</button>
  </div>
  <section id="detalle" style="display: none;">
  <h2>Detalle del expediente</h2>
  <div id="info-detalle"></div>

  <hr style="margin: 20px 0;">

  <h3>Agregar actividad</h3>
  <div id="zona-actividad">
    <textarea id="nueva-actividad" rows="2" placeholder="Descripción de la actividad" style="width: 100%;"></textarea>
    <br><br>
    <button onclick="agregarActividad()">Agregar actividad</button>
  </div>

  <hr style="margin: 20px 0;">

  <h3>Cambiar estado</h3>
  <div id="zona-estado"></div>

  <hr style="margin: 20px 0;">

  <h3>Historial</h3>
  <div id="historial"></div>

  <br>
  <button onclick="cerrarDetalle()">Volver al listado</button>
</section>
  <div id="lista-expedientes">
    <!-- Aquí se van a mostrar los expedientes -->
  </div>
</section>
  </main>

  <script src="app.js"></script>
</body>
</html>
